<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BunnyChen DJI Live</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1e1e1e;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  /* Live view: fullscreen iframe embedding MediaMTX WebRTC player */
  #live {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* ===== Info overlay: always visible, top-only (player controls live at bottom/center) ===== */
  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 10px 16px 8px;
    box-sizing: border-box;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0));
    color: #ffffff;
    z-index: 9999;
    pointer-events: none;   /* let clicks pass through to the video */
  }
  #topbar > * { pointer-events: auto; }
  #topbar .top-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #topbar .title {
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 0 6px #000;
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
  }
  /* Live status dot */
  #status-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ff5252;          /* offline: red */
    box-shadow: 0 0 8px #ff5252;
    display: inline-block;
    animation: blink 1.5s infinite;
  }
  #status-dot.online {
    background: #4caf50;          /* online: green */
    box-shadow: 0 0 8px #4caf50;
    animation: none;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  #status-text {
    font-size: 15px;
    font-weight: normal;
    text-shadow: 0 0 6px #000;
  }
  #topbar .clock {
    text-align: right;
    text-shadow: 0 0 6px #000;
  }
  #clock-time {
    font-size: 22px;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
  }
  #clock-date {
    font-size: 12px;
    opacity: 0.85;
  }

  /* ===== Stream info row (second line under the title, always visible) ===== */
  #info {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 20px;
    margin-top: 6px;
    font-size: 12.5px;
    text-shadow: 0 0 4px #000;
    opacity: 0.9;
  }
  #info .info-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #info .info-label {
    opacity: 0.55;
  }
  #info .info-value {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  #credit {
    margin-left: auto;
    opacity: 0.5;
    font-size: 11px;
    text-align: right;
  }

  @media (max-width: 640px) {
    #topbar { padding: 6px 10px 8px; }
    #topbar .title { font-size: 15px; gap: 6px; }
    #status-text { font-size: 12px; }
    #clock-time { font-size: 17px; }
    #clock-date { font-size: 10px; }
    #info { font-size: 11px; gap: 4px 12px; }
    #credit { display: none; }
  }
</style>
</head>
<body>
  <!-- Live view: iframe src set dynamically to current host IP -->
  <!-- allowfullscreen lets the video inside use the fullscreen button -->
  <iframe id="live" allowfullscreen allow="fullscreen; autoplay; encrypted-media"></iframe>

  <!-- Info overlay: title/status/clock (row 1) + stream info/credit (row 2). -->
  <!-- Kept top-only and always visible so the player controls are never covered. -->
  <div id="topbar">
    <div class="top-main">
      <div class="title">
        <span id="status-dot"></span>
        <span>BunnyChen DJI Live</span>
        <span id="status-text">Checking…</span>
      </div>
      <div class="clock">
        <div id="clock-time">--:--:--</div>
        <div id="clock-date">--/--/----</div>
      </div>
    </div>
    <div id="info">
      <div class="info-item">
        <span class="info-label">Server</span>
        <span id="server-address" class="info-value">--</span>
      </div>
      <div class="info-item">
        <span class="info-label">Path</span>
        <span class="info-value">/livedji/</span>
      </div>
      <div class="info-item">
        <span class="info-label">Protocol</span>
        <span class="info-value">WebRTC (WHEP)</span>
      </div>
      <div id="credit">GitHub: BunnyChen-DJI-RTPM · by BunnyChen</div>
    </div>
  </div>

  <script>
    // ===== Set iframe src dynamically =====
    // Use the current page host IP so LAN devices point the
    // iframe at the machine running MediaMTX, not themselves
    const live = document.getElementById("live");
    const host = window.location.hostname || "127.0.0.1";
    live.src = "http://" + host + ":8889/livedji/";
    document.getElementById("server-address").textContent = host + ":8889";

    // ===== Real-time clock =====
    const timeEl = document.getElementById("clock-time");
    const dateEl = document.getElementById("clock-date");
    const WEEK = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    function pad(n) { return String(n).padStart(2, "0"); }

    function updateClock() {
      const now = new Date();
      timeEl.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
      dateEl.textContent = WEEK[now.getDay()] + " " + now.getFullYear() + "/" + pad(now.getMonth() + 1) + "/" + pad(now.getDate());
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ===== Live status check =====
    // Probe the MediaMTX WHEP endpoint to see if the service is up
    // MediaMTX returns Access-Control-Allow-Origin: *, so cross-origin fetch works
    const dot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");

    async function checkStatus() {
      try {
        const res = await fetch("http://" + host + ":8889/livedji/whep", { method: "OPTIONS" });
        if (res.ok) {
          dot.classList.add("online");
          statusText.textContent = "Online";
        } else {
          dot.classList.remove("online");
          statusText.textContent = "Error (" + res.status + ")";
        }
      } catch (e) {
        dot.classList.remove("online");
        statusText.textContent = "Offline";
      }
    }
    checkStatus();
    setInterval(checkStatus, 5000);

    // Info overlay is intentionally ALWAYS visible. The screen bottom is kept
    // clear so the player's own controls (fullscreen etc.) are never covered.
  </script>
</body>
</html>
